name: Keep server awake

# Render's free plan puts the API to sleep after 15 minutes without requests, and the first
# request after that waits about a minute. Pinging every 10 minutes keeps it awake.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://season-challenger-api.onrender.com/health
