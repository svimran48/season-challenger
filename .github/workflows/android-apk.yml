name: Android APK

# Builds a test APK by hand: Actions, Android APK, Run workflow. The API address goes into the app,
# so a new address needs a new build. Signed with the Expo template's shared debug key, which is
# public: fine for trying the app, never for a release. docs/RELEASE.md has the release route.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: The API's HTTPS address (the Render test server by default)
        required: true
        default: https://season-challenger-api.onrender.com

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      NODE_ENV: production
    steps:
      - name: Check the API address
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::The API address must start with https:// (Android blocks plain http)."; exit 1 ;;
          esac
          case "$API_URL" in
            *trycloudflare.com*) echo "::warning::trycloudflare.com addresses stop working when the tunnel closes, and this APK stops with it. Use the Render address for an APK that keeps working." ;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$API_URL/health" || true)
          if [ "$code" != "200" ]; then
            echo "::warning::$API_URL/health answered '$code', not 200. The APK will build, but it cannot connect until that server is up."
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development
      - name: Generate the Android project
        working-directory: apps/mobile
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Build
        working-directory: apps/mobile/android
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -Dorg.gradle.jvmargs=-Xmx5g
      - uses: actions/upload-artifact@v4
        with:
          name: season-challenger-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
